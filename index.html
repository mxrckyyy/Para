<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Para helps commuters in Cebu discover possible jeepney routes, travel estimates, and saved journeys."
    />
    <meta name="theme-color" content="#15803d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1210" media="(prefers-color-scheme: dark)" />
    <title>Para — Find jeepney routes in Cebu</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('para_theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
